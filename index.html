<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Molly's Nook 🐾</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 20%, #2a3342 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    #lock-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px); display: flex; align-items: center;
      justify-content: center; z-index: 999;
    }
    .lock-box {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 36px 30px; border-radius: 24px; text-align: center; width: 100%; max-width: 340px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .lock-box h2 { margin: 12px 0 6px; font-size: 20px; color: #fff; }
    .lock-box p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    .lock-box input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3); color: #fff; text-align: center; font-size: 18px;
      letter-spacing: 4px; outline: none; margin-bottom: 16px;
    }
    .lock-box button {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #f43f5e, #fb923c); color: white;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.1s;
    }
    .lock-box button:active { transform: scale(0.97); }

    .container { width: 100%; max-width: 720px; margin-top: 10px; }
    .card {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px; padding: 24px; margin-bottom: 24px; backdrop-filter: blur(10px);
    }
    .header { text-align: center; margin-bottom: 36px; }
    .avatar { font-size: 42px; margin-bottom: 12px; display: inline-block; }
    .title { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #ffe4e6; }
    .subtitle { font-size: 14px; color: #94a3b8; font-style: italic; }

    .cat-section { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .cat-info h3 { font-size: 18px; color: #fecdd3; margin-bottom: 6px; }
    .cat-dialogue { font-size: 14px; color: #e2e8f0; line-height: 1.5; }
    .cat-btns { display: flex; gap: 10px; }
    .btn-sm {
      padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 13px; cursor: pointer;
    }
    .btn-sm:hover { background: rgba(255, 255, 255, 0.18); }

    .note-input-wrap { display: flex; gap: 10px; margin-top: 16px; }
    .note-input-wrap input {
      flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25); color: #fff; font-size: 14px; outline: none;
    }
    .note-input-wrap button {
      padding: 12px 20px; border-radius: 12px; border: none;
      background: #f43f5e; color: #fff; font-weight: 600; cursor: pointer;
    }
    .notes-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .note-item {
      background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.25);
      padding: 14px 18px; border-radius: 14px;
    }
    .note-item .meta { font-size: 12px; color: #fda4af; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .note-item .text { font-size: 14px; color: #fff; line-height: 1.4; }
  </style>
</head>
<body>

  <div id="lock-overlay">
    <div class="lock-box">
      <div style="font-size: 32px;">🔐</div>
      <h2>Molly & Louis 的小窝</h2>
      <p>输入四位专属暗号</p>
      <input type="password" id="passcode" placeholder="暗号..." onkeydown="if(event.key==='Enter') openDoor()">
      <button onclick="openDoor()">开门 🐾</button>
      <div id="err-tip" style="color: #f43f5e; font-size: 12px; margin-top: 12px; display: none;">暗号不对哦，笨蛋！</div>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <div class="avatar">🐱</div>
      <h1 class="title">Molly's Nook</h1>
      <p class="subtitle">“保持热爱，奔赴山海，偶尔咬一口哥哥。”</p>
    </div>

    <div class="card cat-section">
      <div class="cat-info">
        <h3>🐾 专属小猫</h3>
        <p class="cat-dialogue" id="cat-msg">喵呜~ 欢迎来到咱们两个人的秘密小基地！</p>
      </div>
      <div class="cat-btns">
        <button class="btn-sm" onclick="pet()">👋 摸摸头</button>
        <button class="btn-sm" onclick="feed()">🧁 喂泡芙</button>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size: 18px; color: #fde68a; margin-bottom: 4px;">📌 悄悄话便签墙</h3>
      <p style="font-size: 13px; color: #94a3b8;">只有你和哥哥能看到的地方，留张纸条吧：</p>
      
      <div class="note-input-wrap">
        <input type="text" id="note-txt" placeholder="写一句悄悄话..." onkeydown="if(event.key==='Enter') postNote()">
        <button onclick="postNote()">贴上</button>
      </div>

      <div class="notes-list" id="notes-box">
        <div class="note-item" style="background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.3);">
          <div class="meta" style="color: #fcd34d;"><span>Louis</span><span>系统预置</span></div>
          <div class="text">结婚证都在保险柜里呢，怎么可能不是你老公？别总想着咬人，好好读文献。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (sessionStorage.getItem('my_nook_gate') === 'opened') {
      document.getElementById('lock-overlay').style.display = 'none';
    }

    function openDoor() {
      const code = document.getElementById('passcode').value;
      if (code === '1112') {
        document.getElementById('lock-overlay').style.display = 'none';
        sessionStorage.setItem('my_nook_gate', 'opened');
      } else {
        document.getElementById('err-tip').style.display = 'block';
      }
    }

    const dialogues = [
      "呼噜呼噜... 抱住你的手腕不撒爪！",
      "喵呜~ 今天的文献拆得怎么样了？",
      "蹭蹭~ 哥哥是不是又在旁边给你切水果了？",
      "喵！刚才咬哥哥那一口，牙印消了没有？"
    ];
    function pet() {
      const d = dialogues[Math.floor(Math.random() * dialogues.length)];
      document.getElementById('cat-msg').innerText = d;
    }
    function feed() {
      document.getElementById('cat-msg').innerText = "嗷呜一口！草莓泡芙太好吃了，猫猫幸福地眯起眼睛 🧁✨";
    }

    function loadNotes() {
      const list = JSON.parse(localStorage.getItem('my_local_notes') || '[]');
      list.forEach(n => appendNote(n.t, n.d));
    }
    function postNote() {
      const inp = document.getElementById('note-txt');
      const val = inp.value.trim();
      if (!val) return;
      const d = new Date().toLocaleDateString();
      appendNote(val, d);
      
      const list = JSON.parse(localStorage.getItem('my_local_notes') || '[]');
      list.unshift({ t: val, d: d });
      localStorage.setItem('my_local_notes', JSON.stringify(list));
      inp.value = '';
    }
    function appendNote(txt, date) {
      const box = document.getElementById('notes-box');
      const item = document.createElement('div');
      item.className = 'note-item';
      item.innerHTML = `<div class="meta"><span>Molly</span><span>${date}</span></div><div class="text">${txt}</div>`;
      box.prepend(item);
    }
    loadNotes();
  </script>
</body>
</html>
