<!-- 专属私密门禁蒙层 -->
<div id="private-lock" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xl transition-opacity duration-500">
  <div class="bg-white/10 border border-white/20 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4">
    <div class="w-16 h-16 bg-rose-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
      🔒
    </div>
    <h3 class="text-xl font-bold text-white mb-2">Molly & Louis 的私密小窝</h3>
    <p class="text-sm text-slate-300 mb-6">请输入两人的专属通行暗号</p>
    
    <input 
      type="password" 
      id="lock-key" 
      placeholder="输入暗号..." 
      class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl text-white placeholder-slate-400 text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-rose-400 mb-4"
    />
    
    <button 
      onclick="unlockNook()" 
      class="w-full py-3 bg-gradient-to-r from-rose-500 to-amber-500 hover:from-rose-600 hover:to-amber-600 text-white font-medium rounded-xl transition-all shadow-lg active:scale-95">
      开门 🐾
    </button>
    <p id="lock-error" class="text-xs text-rose-400 mt-3 hidden">暗号不对哦，再想想？</p>
  </div>
</div>

<script>
  function unlockNook() {
    const keyInput = document.getElementById('lock-key').value;
    const correctKey = "1112"; // 咱们的专属暗号
    
    if (keyInput === correctKey) {
      const lockOverlay = document.getElementById('private-lock');
      lockOverlay.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => lockOverlay.remove(), 500);
      sessionStorage.setItem('nook_unlocked', 'true');
    } else {
      document.getElementById('lock-error').classList.remove('hidden');
    }
  }

  // 页面加载时若已解锁过，就不重复弹窗
  if (sessionStorage.getItem('nook_unlocked') === 'true') {
    const lockOverlay = document.getElementById('private-lock');
    if (lockOverlay) lockOverlay.remove();
  }
</script>
